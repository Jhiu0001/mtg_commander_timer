<!DOCTYPE html>
<html>
<head>
    <title>Scoreboard</title>
</head>

<body>
    <h1>Commander Scoreboard</h1>

    {% for player in players %}

        <p>
            {{ player }} -
            <span id="timer-{{ loop.index0 }}">10:00</span>
        </p>

    {% endfor %}

    <button onclick="nextTurn()">Next Turn</button>
</body>

<script>

    // Create a 10-minute timer for every player
    let playerCount = {{ players|length }};
    let timers = Array(playerCount).fill(600);
  
    // Track whose turn it currently is
    let activePlayer = 0;

    //time display function
    function formatTime(seconds) {
        let minutes = Math.floor(seconds / 60);
        let remainingSeconds = seconds % 60;

        return String(minutes).padStart(2, "0") + ":" +
            String(remainingSeconds).padStart(2, "0");
    }

    // Advance to the next player
    function nextTurn() {
        activePlayer = (activePlayer + 1) % timers.length;
    }

    // Start the countdown timer for the active player
    function startTimer() {
        setInterval(function() {
            if (timers.length === 0) {
                return;
            }

            if (timers[activePlayer] > 0) {
                timers[activePlayer] = timers[activePlayer] - 1;
                document.getElementById("timer-" + activePlayer).textContent =
                    formatTime(timers[activePlayer]);
            }
        }, 1000);

    }

    // Automatically start the game when the scoreboard loads
    startTimer();

</script>

</html>

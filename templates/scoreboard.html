<!DOCTYPE html>
<html>
<head>
    <title>Scoreboard</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/scoreboard.css') }}">
</head>

<body>
    <h1>Commander Scoreboard</h1>

    <p>Round: <span id="round-counter">1</span></p>

    {% for player in players %}

        <div class="player-row"
            data-player-id="{{ player.id }}"
             data-player-name="{{ player.name }}"
             data-remaining-time="{{ player.remaining_time }}">

            <p>
                {{ player.name }} -
                <span id="timer-{{ loop.index0 }}" class="player-timer">
                    {{ "%02d:%02d"|format(player.remaining_time // 60, player.remaining_time % 60) }}
                </span>
            </p>

        </div>

    {% endfor %}

    <button onclick="nextTurn()">Next Turn</button>
    <button onclick="toggleTimeout()">Timeout</button>
    <button onclick="backToSetup()">Back to Setup</button>
    
    <script>
        const savedGameState = {{ game_state | tojson }};
    </script>

    <script src="{{ url_for('static', filename='js/scoreboard.js') }}"></script>

</body>
</html>

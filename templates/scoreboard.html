<!DOCTYPE html>
<html>
<head>
    <title>Scoreboard</title>
</head>

<body>
    <h1>Commander Scoreboard</h1>

    {% for player in players %}

        <p>
            {{ player.name }} -
            <span id="timer-{{ loop.index0 }}">
                {{ "%02d:%02d"|format(player.remaining_time // 60, player.remaining_time % 60) }}
            </span>
        </p>

    {% endfor %}

    <button onclick="nextTurn()">Next Turn</button>

    <button onclick="toggleTimeout()">Timeout</button>

    <p>CTRL+P for Timeout</p>

</body>

<script>

    // Store each player's remaining time
    let timers = [
        {% for player in players %}
            {{ player.remaining_time }},
        {% endfor %}
    ];
  
    // Track whose turn it currently is
    let activePlayer = 0;

    // Track whether the game is currently paused
    let gamePaused = false;

    // Time display as MM:SS
    function formatTime(seconds) {
        let minutes = Math.floor(seconds / 60);
        let remainingSeconds = seconds % 60;

        return String(minutes).padStart(2, "0") + ":" +
            String(remainingSeconds).padStart(2, "0");
    }

    // Advance to the next player
    function nextTurn() {
        activePlayer = (activePlayer + 1) % timers.length;
    }

    // Toggle the global timeout
    function toggleTimeout() {
        gamePaused = !gamePaused;

        if (gamePaused) {
            document.querySelector("button[onclick='toggleTimeout()']").textContent = "Resume Game";
        } else {
            document.querySelector("button[onclick='toggleTimeout()']").textContent = "Timeout";
        }
    }

    // Listen for CTRL+P
    document.addEventListener("keydown", function(event) {

        if (event.ctrlKey && event.key.toLowerCase() === "p") {
            event.preventDefault();
            toggleTimeout();
        }

    });

    // Start the countdown timer
    function startTimer() {

        setInterval(function() {

            // Do nothing while the game is paused
            if (gamePaused) {
                return;
            }

            if (timers.length === 0) {
                return;
            }

            if (timers[activePlayer] > 0) {
                timers[activePlayer] = timers[activePlayer] - 1;

                document.getElementById("timer-" + activePlayer).textContent =
                    formatTime(timers[activePlayer]);
            }

        }, 1000);

    }

    // Automatically start the game when the scoreboard loads
    startTimer();

</script>

</html>

<!DOCTYPE html>
<html>
<head>
    <title>Commander Timer</title>
</head>

<form method="POST">

    <h1>Setup</h1>

    <p>Enter Player Names:</p>

    {% for player in players %}

        <input type="text" name="players" value="{{ player.name }}">

        <input
        type="text"
        name="times"
        value="{{ '%02d:%02d'|format(player.remaining_time // 60, player.remaining_time % 60) }}"
        pattern="[0-9]+:[0-5][0-9]"
        title="Enter time as MM:SS, e.g. 10:00"
        >

        {% if not loop.first %}
            <button type="submit" name="move_up" value="{{ loop.index0 }}">↑</button>
        {% endif %}

        {% if not loop.last %}
            <button type="submit" name="move_down" value="{{ loop.index0 }}">↓</button>
        {% endif %}

        <button type="submit" name="delete_index" value="{{ loop.index0 }}">X</button>

        <br><br>

    {% endfor %}

    <button type="submit"> Add Player</button>

    <button type="submit" name="start_game" value="true">Start Game</button>

</form>
</html>
